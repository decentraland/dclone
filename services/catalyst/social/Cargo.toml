[package]
name = "catalyst-social"
version.workspace = true
edition = "2024"
description = "Social: friends, communities, notifications, badges, profiles and the social RPC"
publish = false

[dependencies]
dcl-http = { workspace = true, features = ["db"] }
dcl-auth.workspace = true
catalyst-fed = { path = "../fed" }
catalyst-jobs = { path = "../jobs" }
catalyst-shared = { path = "../shared" }
catalyst-storage = { path = "../storage" }
catalyst-chain-index = { path = "../chain-index" }
catalyst-content = { path = "../content" }
catalyst-explore = { path = "../explore" }
catalyst-comms = { path = "../comms" }
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
uuid.workspace = true
tokio-util.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
hex.workspace = true
libc.workspace = true
urlencoding.workspace = true
base64.workspace = true
sha2.workspace = true
reqwest.workspace = true
url.workspace = true
prost.workspace = true
multer.workspace = true
unicode-normalization.workspace = true
icu_properties.workspace = true
image.workspace = true
openmls.workspace = true
openmls_rust_crypto.workspace = true
openmls_traits.workspace = true
tls_codec.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "catalyst-shared/ts", "catalyst-storage/ts", "catalyst-chain-index/ts", "catalyst-content/ts", "catalyst-explore/ts", "catalyst-comms/ts"]
test-support = ["catalyst-fed/test-support", "catalyst-shared/test-support", "catalyst-storage/test-support", "catalyst-chain-index/test-support", "catalyst-content/test-support", "catalyst-explore/test-support", "catalyst-comms/test-support"]

[dev-dependencies]
catalyst-shared = { path = "../shared", features = ["test-support"] }
catalyst-storage = { path = "../storage", features = ["test-support"] }
catalyst-chain-index = { path = "../chain-index", features = ["test-support"] }
catalyst-content = { path = "../content", features = ["test-support"] }
catalyst-explore = { path = "../explore", features = ["test-support"] }
catalyst-comms = { path = "../comms", features = ["test-support"] }
catalyst-db = { path = "../db", features = ["scratch"] }
catalyst-testing = { path = "../testing" }
catalyst-fed = { path = "../fed", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
alloy = { version = "2", default-features = false, features = ["std", "signer-local"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
rustls = { workspace = true, features = ["ring"] }
openmls_basic_credential = "0.6.0"
