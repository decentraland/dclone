[package]
name = "catalyst-explore"
version.workspace = true
edition = "2024"
description = "Explore: places, events, imposters and the discovery APIs, mirrored from their upstreams"
publish = false

[dependencies]
dcl-http = { workspace = true, features = ["db"] }
dcl-auth.workspace = true
catalyst-fed = { path = "../fed" }
catalyst-jobs = { path = "../jobs" }
catalyst-shared = { path = "../shared" }
catalyst-config = { path = "../config" }
catalyst-storage = { path = "../storage" }
catalyst-content = { path = "../content" }
catalyst-land-authz = { path = "../land-authz" }
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
anyhow.workspace = true
futures.workspace = true
bytes.workspace = true
uuid.workspace = true
tokio-util.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
hex.workspace = true
libc.workspace = true
urlencoding.workspace = true
base64.workspace = true
alloy-primitives.workspace = true
sha2.workspace = true
reqwest.workspace = true
flate2.workspace = true
url.workspace = true
regex.workspace = true
rrule.workspace = true
tiny-skia.workspace = true
rand.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
zip.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "catalyst-shared/ts", "catalyst-config/ts", "catalyst-storage/ts", "catalyst-content/ts", "catalyst-land-authz/ts"]
test-support = ["catalyst-fed/test-support", "catalyst-shared/test-support", "catalyst-config/test-support", "catalyst-storage/test-support", "catalyst-content/test-support", "catalyst-land-authz/test-support"]

[dev-dependencies]
catalyst-shared = { path = "../shared", features = ["test-support"] }
catalyst-config = { path = "../config", features = ["test-support"] }
catalyst-storage = { path = "../storage", features = ["test-support"] }
catalyst-content = { path = "../content", features = ["test-support"] }
catalyst-land-authz = { path = "../land-authz", features = ["test-support"] }
catalyst-db = { path = "../db", features = ["scratch"] }
catalyst-fed = { path = "../fed", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
alloy = { version = "2", default-features = false, features = ["std", "signer-local"] }
